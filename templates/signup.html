{% extends 'base.html' %}

{% block title %}Sign Up - TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="avatar-circle avatar-circle-lg mx-auto mb-3 shadow">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h3 class="fw-bold text-dark">Get Started</h3>
                <p class="text-muted small">Create your account in seconds</p>
            </div>

            <form action="{{ url_for('signup') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-primary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-light border-start-0" placeholder="e.g. alex24" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-primary"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control bg-light border-start-0" placeholder="alex@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-primary"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand w-100 py-2 fw-semibold shadow-sm">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
