{% extends 'base.html' %}

{% block title %}Login - TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-box-arrow-in-right display-5 text-primary"></i>
                <h3 class="fw-bold mt-2">Welcome Back</h3>
                <p class="text-muted small">Log in to manage your tasks</p>
            </div>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">
                    Log In
                </button>
            </form>
            <div class="text-center mt-4 border-top pt-3">
                <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('signup') }}" class="text-decoration-none fw-semibold">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
