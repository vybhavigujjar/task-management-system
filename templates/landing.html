<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Focus on what matters</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-white">
    <div class="min-h-screen bg-white p-3 sm:p-4 md:p-6">
        <!-- Rounded Video Container -->
        <div class="relative rounded-2xl sm:rounded-3xl overflow-hidden min-h-[calc(100vh-24px)] sm:min-h-[calc(100vh-32px)] md:min-h-[calc(100vh-48px)] lg:h-[calc(100vh-48px)] flex flex-col justify-between">
            <!-- Full-screen Background Video -->
            <video class="absolute inset-0 w-full h-full object-cover" autoplay muted loop playsinline>
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260602_150901_c45b90ec-18d7-42ff-90e2-b95d7109e330.mp4" type="video/mp4">
            </video>

            <!-- Subtle dark gradient overlay to make text pop -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-black/10 to-black/20 pointer-events-none"></div>

            <!-- Content Layer -->
            <div class="relative z-10 flex flex-col justify-between h-full p-5 sm:p-8 md:p-12">
                <!-- Top Navbar: Clean & Minimalist -->
                <header class="flex items-center justify-between w-full">
                    <!-- Brand Logo -->
                    <a href="{{ url_for('home') }}" class="bg-white/70 hover:bg-white/90 backdrop-blur-md rounded-2xl shadow-sm px-4 py-2.5 flex items-center gap-2.5 transition-all">
                        <svg class="w-6 h-6 shrink-0" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M 256 256 L 128 256 L 0 128 L 128 128 Z M 256 128 L 128 128 L 0 0 L 128 0 Z" fill="black"/>
                        </svg>
                        <span class="font-bold text-gray-900 tracking-tight text-base">TaskFlow</span>
                    </a>

                    <!-- Top Right: Log In Button -->
                    <div class="flex items-center gap-2.5">
                        <a href="{{ url_for('login') }}" class="bg-black hover:bg-gray-800 text-white text-sm font-semibold px-6 py-2.5 rounded-xl shadow-lg transition-all hover:scale-[1.02] active:scale-[0.98]">
                            Log In
                        </a>
                    </div>
                </header>

                <!-- Bottom Hero: Focused, Clean & Authentic -->
                <div class="max-w-xl pb-2 sm:pb-4">
                    <span class="inline-flex items-center gap-2 bg-white/75 backdrop-blur-md px-3.5 py-1.5 rounded-full text-xs font-semibold text-gray-800 shadow-sm mb-4">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Simple &bull; Focused &bull; Secure
                    </span>
                    <h1 class="text-white text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight drop-shadow-lg leading-tight mb-3">
                        Focus on what matters.
                    </h1>
                    <p class="text-white/90 text-base sm:text-lg drop-shadow font-normal mb-6 leading-relaxed max-w-lg">
                        A clean, distraction-free space to organize your daily priorities and accomplish your goals.
                    </p>
                    <div class="flex items-center gap-3">
                        <a href="{{ url_for('login') }}" class="bg-white hover:bg-gray-100 text-gray-900 font-semibold text-sm px-6 py-3 rounded-xl shadow-xl transition-all hover:scale-[1.02] active:scale-[0.98]">
                            Log In to Your Workspace &rarr;
                        </a>
                        <a href="{{ url_for('signup') }}" class="bg-black/35 hover:bg-black/55 text-white font-medium text-sm px-5 py-3 rounded-xl backdrop-blur-md border border-white/20 transition-all">
                            Sign Up
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
